<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="accent-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.8" stroke-opacity="0.3" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-pill {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.4; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.7; }
    }
    @keyframes sweepGlow {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }
    .anim-orb-1 {
      animation: pulseOrb 8s ease-in-out infinite alternate;
      transform-origin: 200px 100px;
    }
    .anim-orb-2 {
      animation: pulseOrb 10s ease-in-out infinite alternate-reverse;
      transform-origin: 1000px 300px;
    }
    .float-item-1 { animation: floatParticle 4s ease-in-out infinite; }
    .float-item-2 { animation: floatParticle 5s ease-in-out 1s infinite; }
    .float-item-3 { animation: floatParticle 4.5s ease-in-out 2s infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="420" fill="url(#grid-pattern)" rx="16" />

  <!-- Dynamic Glowing Ambient Orbs (Strictly in Background) -->
  <g class="anim-orb-1">
    <circle cx="220" cy="120" r="140" fill="#38bdf8" opacity="0.25" filter="url(#glow)" />
  </g>
  <g class="anim-orb-2">
    <circle cx="980" cy="300" r="180" fill="#a855f7" opacity="0.22" filter="url(#glow)" />
    <circle cx="850" cy="150" r="110" fill="#ec4899" opacity="0.18" filter="url(#glow)" />
  </g>

  <!-- Top Decorative Accent Bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent-glow)" />

  <!-- Code / Circuit Dynamic Schematic Background Lines -->
  <g stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.25" fill="none">
    <path d="M 50 80 L 180 80 L 220 120 L 400 120" />
    <circle cx="400" cy="120" r="3" fill="#38bdf8" fill-opacity="0.6" />
    <path d="M 800 320 L 950 320 L 1000 270 L 1150 270" />
    <circle cx="800" cy="320" r="3" fill="#a855f7" fill-opacity="0.6" />
  </g>

  <!-- Content Group (Clean, Crisp Foreground) -->
  <g transform="translate(80, 0)">
    
    <!-- Status / Top Category Pill -->
    <g transform="translate(0, 52)">
      <rect width="250" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1" />
      <circle cx="14" cy="14" r="5" fill="#38bdf8" filter="url(#glow)" />
      <text x="28" y="18" fill="#38bdf8" class="badge-pill">Autonomous SDLC &amp; Scaffolding</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 135)">
      <text class="title-text">
        Code Generation &amp; Automated Scaffolding
      </text>
    </g>

    <!-- Subtitle / Tagline -->
    <g transform="translate(0, 185)">
      <text class="subtitle-text">
        Curated Index of AI Coding Agents, IDE Copilots, Monorepo Scaffolding &amp; Deterministic Code Generators
      </text>
    </g>

    <!-- Feature Pills / Highlights (Floating Foreground Badges) -->
    <g transform="translate(0, 240)">
      
      <!-- Pill 1: Autonomous Agents -->
      <g class="float-item-1" transform="translate(0, 0)">
        <rect width="180" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <rect width="4" height="42" rx="2" fill="#38bdf8" />
        <text x="18" y="26" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14px" font-weight="600">⚡ Autonomous Agents</text>
      </g>

      <!-- Pill 2: AI-Native IDEs -->
      <g class="float-item-2" transform="translate(200, 0)">
        <rect width="165" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <rect width="4" height="42" rx="2" fill="#a855f7" />
        <text x="18" y="26" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14px" font-weight="600">💻 AI-Native IDEs</text>
      </g>

      <!-- Pill 3: Full-Stack App Builders -->
      <g class="float-item-3" transform="translate(385, 0)">
        <rect width="205" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <rect width="4" height="42" rx="2" fill="#ec4899" />
        <text x="18" y="26" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14px" font-weight="600">🚀 Full-Stack Builders</text>
      </g>

      <!-- Pill 4: AST & Project Scaffolders -->
      <g class="float-item-1" transform="translate(610, 0)">
        <rect width="215" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <rect width="4" height="42" rx="2" fill="#10b981" />
        <text x="18" y="26" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14px" font-weight="600">🛠️ Deterministic Generators</text>
      </g>

      <!-- Pill 5: Open-Source Models -->
      <g class="float-item-2" transform="translate(845, 0)">
        <rect width="195" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <rect width="4" height="42" rx="2" fill="#f59e0b" />
        <text x="18" y="26" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14px" font-weight="600">🔓 Open-Source &amp; Local</text>
      </g>

    </g>

    <!-- Bottom Metadata Line -->
    <g transform="translate(0, 345)">
      <text font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13px" fill="#64748b">
        Updated November 2026 • Curated by Ishan Dutta • Enterprise Valuations, Transparent Pricing &amp; Live Star Metrics
      </text>
    </g>

  </g>
</svg>
